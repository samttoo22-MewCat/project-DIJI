[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-diji"
version = "0.1.0"
description = "Self-hosted role-play experimentation framework"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.0",
  "opencc-python-reimplemented>=0.1.7",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
